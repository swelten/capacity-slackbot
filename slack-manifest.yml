display_information:
  name: capacity-slackbot
  description: Weekly capacity tracking bot
  background_color: "#2047bd"

features:
  bot_user:
    display_name: capacity-slackbot
    always_online: true
  slash_commands:
    - command: /capacity-ping
      url: https://yi5vs7ozb5tggptffbm67iv43e0wysgo.lambda-url.eu-central-1.on.aws/slack/events
      description: Trigger the capacity reminder manually
      usage_hint: "/capacity-ping"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:history
      - im:write
      - channels:history
      - groups:history
      - channels:read
      - users:read

settings:
  event_subscriptions:
    request_url: https://yi5vs7ozb5tggptffbm67iv43e0wysgo.lambda-url.eu-central-1.on.aws/slack/events
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://yi5vs7ozb5tggptffbm67iv43e0wysgo.lambda-url.eu-central-1.on.aws/slack/events
  socket_mode_enabled: false
  org_deploy_enabled: false
  token_rotation_enabled: false
